<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Topologie du TP 1 : le réseau d’une maison</title>
  <desc id="d">Un routeur R-Maison relie le fournisseur d’accès au réseau 192.168.50.0/24. Un commutateur dessert un PC, un portable et une imprimante.</desc>
  <rect width="760" height="430" rx="16" fill="#0b1020"/>
  <path d="M380 67 V86 H380 V105" fill="none" stroke="#334155" stroke-width="2"/><text x="380" y="81" text-anchor="middle" fill="#00d9ff" font-size="11" font-family="'JetBrains Mono', Consolas, monospace">Gi0/1</text>
  <path d="M380 163 V186 H380 V209" fill="none" stroke="#334155" stroke-width="2"/><text x="380" y="181" text-anchor="middle" fill="#00d9ff" font-size="11" font-family="'JetBrains Mono', Consolas, monospace">Gi0/0</text>
  <path d="M380 255 V280 H130 V305" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M380 255 V280 H380 V305" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M380 255 V280 H630 V305" fill="none" stroke="#334155" stroke-width="2"/>
  <g>
    <rect x="285" y="21" width="190" height="46" rx="10" fill="#0f1a33" stroke="#64748b" stroke-width="2"/>
    <text x="380" y="41" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Fournisseur d’accès</text>
    <text x="380" y="59" text-anchor="middle" fill="#94a3b8" font-size="11">WAN, hors du TP</text>
  </g>
  <g>
    <rect x="275" y="105" width="210" height="58" rx="10" fill="#0f1a33" stroke="#00d9ff" stroke-width="2"/>
    <text x="380" y="131" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">R-Maison</text>
    <text x="380" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">Passerelle · DHCP · IPv6</text>
  </g>
  <g>
    <rect x="300" y="209" width="160" height="46" rx="10" fill="#0f1a33" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="229" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">SW-Maison</text>
    <text x="380" y="247" text-anchor="middle" fill="#94a3b8" font-size="11">Commutateur</text>
  </g>
  <g>
    <rect x="40" y="305" width="180" height="54" rx="10" fill="#0f1a33" stroke="#22c55e" stroke-width="2"/>
    <text x="130" y="329" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">PC-Salon</text>
    <text x="130" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">adresse par DHCP</text>
  </g>
  <g>
    <rect x="290" y="305" width="180" height="54" rx="10" fill="#0f1a33" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="329" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Laptop</text>
    <text x="380" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">adresse par DHCP</text>
  </g>
  <g>
    <rect x="540" y="305" width="180" height="54" rx="10" fill="#0f1a33" stroke="#f59e0b" stroke-width="2"/>
    <text x="630" y="329" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Imprimante</text>
    <text x="630" y="347" text-anchor="middle" fill="#94a3b8" font-size="11">adresse fixe</text>
  </g>
  <text x="380" y="416" text-anchor="middle" fill="#94a3b8" font-size="12">Réseau local : 192.168.50.0/24 · délégation IPv6 du fournisseur : 2001:db8:5a00::/56</text>
