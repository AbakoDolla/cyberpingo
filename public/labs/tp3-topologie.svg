<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">Topologie du TP 3 : trois sites reliés par des routes statiques</title>
  <desc id="d">Le routeur du siège est relié par deux liaisons /30 aux routeurs des agences Nord et Sud. Chaque site a son réseau local.</desc>
  <rect width="760" height="450" rx="16" fill="#0b1020"/>
  <path d="M380 79 V120 H150 V161" fill="none" stroke="#334155" stroke-width="2"/><text x="265" y="115" text-anchor="middle" fill="#00d9ff" font-size="11" font-family="'JetBrains Mono', Consolas, monospace">172.20.0.0/30</text>
  <path d="M380 79 V120 H610 V161" fill="none" stroke="#334155" stroke-width="2"/><text x="495" y="115" text-anchor="middle" fill="#00d9ff" font-size="11" font-family="'JetBrains Mono', Consolas, monospace">172.20.0.4/30</text>
  <path d="M150 219 V261 H150 V303" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M610 219 V261 H610 V303" fill="none" stroke="#334155" stroke-width="2"/>
  <g>
    <rect x="265" y="21" width="230" height="58" rx="10" fill="#0f1a33" stroke="#00d9ff" stroke-width="2"/>
    <text x="380" y="47" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">R-Siege</text>
    <text x="380" y="65" text-anchor="middle" fill="#94a3b8" font-size="11">LAN 10.60.0.0/24</text>
  </g>
  <g>
    <rect x="45" y="161" width="210" height="58" rx="10" fill="#0f1a33" stroke="#22c55e" stroke-width="2"/>
    <text x="150" y="187" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">R-Nord</text>
    <text x="150" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">LAN 10.60.4.0/24</text>
  </g>
  <g>
    <rect x="505" y="161" width="210" height="58" rx="10" fill="#0f1a33" stroke="#7c3aed" stroke-width="2"/>
    <text x="610" y="187" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">R-Sud</text>
    <text x="610" y="205" text-anchor="middle" fill="#94a3b8" font-size="11">LAN 10.60.5.0/24</text>
  </g>
  <g>
    <rect x="55" y="303" width="190" height="54" rx="10" fill="#0f1a33" stroke="#22c55e" stroke-width="2"/>
    <text x="150" y="327" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">PC-Nord</text>
    <text x="150" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">10.60.4.10</text>
  </g>
  <g>
    <rect x="515" y="303" width="190" height="54" rx="10" fill="#0f1a33" stroke="#7c3aed" stroke-width="2"/>
    <text x="610" y="327" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">PC-Sud</text>
    <text x="610" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">10.60.5.10</text>
  </g>
  <text x="380" y="436" text-anchor="middle" fill="#94a3b8" font-size="12">Chaque liaison entre routeurs est un petit réseau /30 : deux adresses utilisables, une par routeur.</text>
</svg>
